[project]
name = "cfd"
version = "0.1.0"
description = "Distribution-free probabilistic demand forecasting & inventory optimization"
requires-python = ">=3.12,<3.14"
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "pyarrow>=16",
    "pyyaml>=6",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
