data:
  source: m5                 # synthetic | m5
  raw_dir: data/raw
  processed_path: data/processed/panel.parquet
  store: CA_1                # m5 only: restrict to one store
  top_n_series: 500          # m5 only: keep top-N series by total volume
  synthetic:
    n_series: 60
    n_days: 900
    seed: 42

features:
  # ORIGIN SAFETY: a 28-day-ahead forecast may only use target-derived features that are
  # known at the forecast origin. origin_shift must equal splits.horizon, and every lag
  # must be >= origin_shift -- build_features enforces both.
  origin_shift: 28
  lags: [28, 35, 42, 56]
  rolling_windows: [7, 28]
  groups: [calendar, price, lags, rolling, hierarchy]

model:
  quantiles: [0.025, 0.05, 0.10, 0.25, 0.50, 0.75, 0.80, 0.90, 0.95, 0.975]
  val_len: 28              # carved off the END OF TRAIN for early stopping -- never calib
  point_objective: tweedie # zero-inflated counts; predicts a conditional mean
  num_boost_round: 400
  early_stopping_rounds: 40
  params:
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 100
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 1
    tweedie_variance_power: 1.1
    verbose: -1
    num_threads: 0

splits:
  n_folds: 5
  horizon: 28
  calib_len: 56
  min_train_days: 365

conformal:
  alpha: 0.10
  nominal_levels: [0.50, 0.80, 0.90, 0.95]   # each needs (a/2, 1-a/2) in model.quantiles
  aci:
    gamma: 0.05          # ACI step size; larger reacts faster and oscillates more
    feedback_lag: 1      # days between a realised outcome and its use in the update

shift:
  # synthetic shifts applied to the TEST window only -- predictions are left untouched,
  # so this isolates "the world moved" from "the model moved"
  onset_day: 8           # 1-indexed test day the shift starts on (1 = whole window)
  scenarios:
    none: {}
    level_up: {multiply: 1.5}
    level_down: {multiply: 0.6}
    variance: {lognormal_sigma: 0.6}

decision:
  holding_cost: 1.0
  cost_ratios: [1, 2, 3, 4, 6, 8, 10]

eval:
  results_path: results/results.parquet
  preds_path: results/preds/gbm.parquet
  figures_dir: reports/figures
  tables_dir: reports/tables
  n_boot: 10000
  seed: 42
